services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:app --host "$${APP_HOST}" --port "$${APP_PORT}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      COMPANY_DOCUMENTS_ROOT: ${COMPANY_DOCUMENTS_ROOT:-/data/company-documents}
      MAX_COMPANY_DOCUMENT_SIZE_MB: ${MAX_COMPANY_DOCUMENT_SIZE_MB:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      POLICY_RETRIEVAL_CANDIDATE_COUNT: ${POLICY_RETRIEVAL_CANDIDATE_COUNT:-20}
      POLICY_RETRIEVAL_TOP_K: ${POLICY_RETRIEVAL_TOP_K:-8}
      POLICY_RETRIEVAL_MIN_SIMILARITY: ${POLICY_RETRIEVAL_MIN_SIMILARITY:-0.3}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - company_document_data:/data/company-documents
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      COMPANY_DOCUMENTS_ROOT: ${COMPANY_DOCUMENTS_ROOT:-/data/company-documents}
      MAX_COMPANY_DOCUMENT_SIZE_MB: ${MAX_COMPANY_DOCUMENT_SIZE_MB:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      PUBLISHER_PROVIDER: ${PUBLISHER_PROVIDER:-bluesky}
      BLUESKY_IDENTIFIER: ${BLUESKY_IDENTIFIER:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      BLUESKY_SERVICE_URL: ${BLUESKY_SERVICE_URL:-https://bsky.social}
      BLUESKY_TIMEOUT_SECONDS: ${BLUESKY_TIMEOUT_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - company_document_data:/data/company-documents
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-pgvector.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  company_document_data:
