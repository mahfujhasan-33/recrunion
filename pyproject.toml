[project]
name = "recrunion"
version = "0.1.0"
description = "AI-Powered Recruitment & Interview Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.15.2",
    "email-validator==2.2.0",
    "fastapi==0.115.12",
    "jinja2==3.1.6",
    "langchain-core==1.6.6",
    "langchain-google-genai==4.4.0",
    "langgraph==1.2.12",
    "psycopg[binary]==3.2.6",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.4",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/**/*.html", "static/css/*.css", "static/js/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".git", ".venv", "venv", "build", "dist", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
pretty = true
