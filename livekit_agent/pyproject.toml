[project]
name = "recrunion-livekit-transcriber"
version = "0.1.0"
description = "STT-only LiveKit publisher agent for RecrUnion"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "livekit-agents[assemblyai]==1.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.4",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent"]

[tool.setuptools.packages.find]
include = ["recrunion_transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
